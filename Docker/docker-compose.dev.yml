
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: imc_db
      MYSQL_USER: imc_user
      MYSQL_PASSWORD: imc_pass
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ../Backend
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - ../Backend/.env
    volumes:
      - ../Backend:/app   # 🔥 live reload
    ports:
      - "8000:8000"
    depends_on:
      - mysql

  frontend:
    build:
      context: ../Frontend/imc
      dockerfile: Dockerfile.dev
    volumes:
      - ../Frontend/imc:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=500


volumes:
  mysql_data:
